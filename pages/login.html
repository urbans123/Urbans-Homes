<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar — Urban Homes</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">
      <span class="brand-icon">⬡</span>
      <span class="brand-name">Urban Homes</span>
    </div>

    <h2>Bienvenido</h2>
    <p class="subtitle">Ingresa con tus credenciales de propietario</p>

    <p class="login-error" id="loginError"></p>

    <form id="formLogin">
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" placeholder="propietario1" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="form-submit" style="margin-top:.5rem;">Ingresar</button>
    </form>

    <div class="login-hint">
      <strong>Usuarios de prueba:</strong><br/>
      propietario1 / 1234<br/>
      propietario2 / 5678<br/>
      admin / admin
    </div>

    <p style="text-align:center;margin-top:1.5rem;font-size:.85rem;color:var(--clr-muted);">
      <a href="../index.html" style="color:var(--clr-accent);font-weight:600;">← Volver al inicio</a>
    </p>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
